[workspace]
members = ["kernel-api", "kernels", "kernel-verify", "engine", "model", "server", "tools/trace-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/smgglrs-ai/tempura"

[workspace.dependencies]
vstd = { version = "0.0.0-2026-06-14-0213", default-features = false }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(verus_keep_ghost)', 'cfg(verus_keep_ghost_body)'] }
