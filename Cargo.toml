[workspace]
members = ["crates/staticpar", "kernel-api", "kernels", "kernel-verify", "engine", "model", "server", "tools/trace-cli", "tools/bench-gpu", "tools/bench", "tools/compare", "tools/integration"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/smgglrs-ai/tempura"

[workspace.dependencies]
vstd = { version = "0.0.0-2026-06-14-0213", default-features = false }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(verus_keep_ghost)', 'cfg(verus_keep_ghost_body)'] }

# Fat LTO across all crates + single codegen unit to give LLVM the widest
# cross-function optimisation scope.  Combined with target-cpu=native and the
# explicit AVX-512 feature flags in .cargo/config.toml, this brings
# ggml_gemv_q4_k_8x8_q8_k from 426 instructions down to 322 — 6% below GCC
# -O3 -march=native at 344.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# Inherits release settings; used by scripts/build-pgo.sh for the optimised
# pass so that PGO can stack on top of LTO without a profile key collision.
[profile.release-pgo]
inherits = "release"

[workspace.lints.clippy]
# Kernel functions have many parameters by necessity (SIMD, block layout, strides)
too_many_arguments = "allow"
# Unsafe kernel functions; safety is enforced by invariants at the call site
missing_safety_doc = "allow"
# Index loops are idiomatic in SIMD/numerical kernels for clarity and performance
needless_range_loop = "allow"
