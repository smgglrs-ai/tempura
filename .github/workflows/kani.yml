name: Kani Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: kani-${{ github.ref }}
  cancel-in-progress: true

env:
  KANI_VERSION: "0.67.0"

jobs:
  # Classify which areas changed (fast, ~seconds). The verification jobs are
  # 90+ min each; docs-only or script-only pushes must not pay for them.
  # Dependency edges are respected: engine builds against kernels, so a
  # kernels change runs BOTH kernels and engine verification; a pure engine
  # change runs only engine. Shared surface (workspace manifests, lockfile,
  # .cargo config, this workflow) counts as affecting both.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tempura-kernels: ${{ steps.filter.outputs.tempura-kernels }}
      tempura-engine: ${{ steps.filter.outputs.tempura-engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tempura-kernels:
              - 'kernels/**'
              - 'kernel-api/**'
              - 'tools/**/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/kani.yml'
            tempura-engine:
              - 'engine/**'
              - 'kernels/**'
              - 'kernel-api/**'
              - 'tools/**/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/kani.yml'

  # The engine suite exceeds 300 min in ONE job (run 216: cancelled at the
  # 300-min cap; kernels green at ~103 min in the same run). Split the
  # engine harnesses across a matrix of shards. This job enumerates the
  # #[kani::proof] fns in engine/src (cargo kani list cannot run on this
  # workspace: it rejects --ignore-global-asm, which pulp's global ASM
  # requires) and emits a JSON matrix. Self-maintaining: every harness
  # found lands in exactly one shard, so a NEW harness cannot be silently
  # skipped -- the grep is the source of truth, same source cargo kani
  # compiles.
  plan-engine:
    needs: changes
    if: needs.changes.outputs.tempura-engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate and shard engine harnesses
        id: plan
        run: |
          python3 - <<'EOF'
          import json, os, pathlib, re, sys

          names = []
          for f in sorted(pathlib.Path('engine/src').rglob('*.rs')):
              flag = False
              for line in f.read_text().splitlines():
                  if '#[kani::proof]' in line:
                      flag = True
                  m = re.search(r'\bfn\s+(\w+)', line)
                  if flag and m:
                      names.append(m.group(1))
                      flag = False
          names = sorted(set(names))
          if not names:
              sys.exit("plan-engine: no #[kani::proof] harnesses found in engine/src -- grep is broken, refusing to emit an empty matrix")
          # ONE harness per shard: run 217 showed the gguf/dequant-class
          # harnesses exceed 2h EACH on a GH runner (three 2-harness shards
          # hit the 240-min cap; every other shard was green). Pairing can
          # stack two slow harnesses past any budget. 25 singleton jobs
          # exceed the 20-concurrent-job free-tier limit, so some queue --
          # wall time is still bounded by the slowest SINGLE harness.
          shards = [[n] for n in names]
          matrix = {"shard": [" ".join(s) for s in shards]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"matrix={json.dumps(matrix)}\n")
          print(f"{len(names)} harnesses in {len(shards)} shards:")
          for s in shards:
              print("  " + " ".join(s))
          EOF

  kani-kernels:
    needs: changes
    if: needs.changes.outputs.tempura-kernels == 'true'
    runs-on: ubuntu-latest
    # The kernels suite takes ~90-105 min on a GH runner (green in runs
    # 214/215/216).
    timeout-minutes: 300
    defaults:
      run:
        working-directory: smgglrs-ai/tempura
    steps:
      # Layout: the tempura crates reference cuda-oxide via RELATIVE sibling
      # paths (../../NVLabs/cuda-oxide from the workspace root). Cargo resolves
      # optional path-dep manifests even when the features are off, so the
      # sibling clone MUST exist for any cargo invocation to succeed -- the
      # absolute /home/... paths used before made every CI run since the
      # cuda-oxide deps landed fail in 0s ("failed to load manifest for
      # dependency cuda-core"); kani.yml was 0/210 green (2026-11-10).
      - uses: actions/checkout@v4
        with:
          path: smgglrs-ai/tempura

      - uses: actions/checkout@v4
        with:
          repository: NVLabs/cuda-oxide
          path: NVLabs/cuda-oxide
          fetch-depth: 1

      - name: Install Kani
        run: cargo install --version ${{ env.KANI_VERSION }} --locked kani-verifier && cargo kani setup

      - name: Verify tempura-kernels
        run: cargo kani --package tempura-kernels -Z unstable-options --ignore-global-asm
        # --ignore-global-asm: the `gemm` -> `pulp` dependency contains global
        # ASM, which Kani 0.67 cannot compile; without this flag the job has
        # been failing since gemm landed (2026-06-15).

  kani-engine:
    needs: [changes, plan-engine]
    if: needs.changes.outputs.tempura-engine == 'true'
    runs-on: ubuntu-latest
    # Singleton shard: slowest single harness + compile. The gguf/dequant
    # class ran >2h each on a GH runner (run 217); 300 min gives headroom
    # without allowing pairing to stack slow harnesses.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-engine.outputs.matrix) }}
    defaults:
      run:
        working-directory: smgglrs-ai/tempura
    steps:
      - uses: actions/checkout@v4
        with:
          path: smgglrs-ai/tempura

      - uses: actions/checkout@v4
        with:
          repository: NVLabs/cuda-oxide
          path: NVLabs/cuda-oxide
          fetch-depth: 1

      - name: Install Kani
        run: cargo install --version ${{ env.KANI_VERSION }} --locked kani-verifier && cargo kani setup

      - name: Verify tempura-engine shard
        run: |
          ARGS=""
          for h in ${{ matrix.shard }}; do ARGS="$ARGS --harness $h"; done
          echo "shard: $ARGS"
          cargo kani --package tempura-engine -Z unstable-options --ignore-global-asm $ARGS
        # --harness is substring-matched against the fully qualified name;
        # a name that is a prefix of another may pull it into this shard too
        # (duplicated work, never a skip). Coverage is guaranteed by
        # plan-engine: every #[kani::proof] fn in engine/src is in exactly
        # one shard string.
