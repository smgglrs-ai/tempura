name: Kani Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  KANI_VERSION: "0.67.0"

jobs:
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Kani
        run: cargo install --version ${{ env.KANI_VERSION }} --locked kani-verifier && cargo kani setup

      - name: Verify tempura-kernels
        run: cargo kani --package tempura-kernels

      - name: Verify tempura-engine
        run: cargo kani --package tempura-engine
