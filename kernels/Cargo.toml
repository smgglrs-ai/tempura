[package]
name = "tempura-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kernel traits and CPU reference implementations for tempura"

[features]
default = ["cpu"]
cpu = []
cuda = ["cutile"]
cutile = ["dep:cutile", "dep:cuda-core"]
# oxide-gemv: embed the rustc-codegen-cuda Q2_0 GEMV kernel.
# Requires build.rs to have run `cargo oxide build tools/oxide-gemv` and
# written the PTX to $OUT_DIR/oxide_q2_gemv.ptx.  Enable alongside `cutile`.
oxide-gemv = ["cutile"]
npu-intel = []
npu-qualcomm = []
openmp = []

[build-dependencies]
cc = "1"

[dependencies]
tempura-kernel-api = { path = "../kernel-api" }
staticpar = { path = "../crates/staticpar" }
bitflags = "2"
thiserror = "2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gemm = "0.18"
half = "2"
libm = "0.2"
cuda-device = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/cuda-oxide/crates/cuda-device", optional = true }
cuda-host = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/cuda-oxide/crates/cuda-host", optional = true }
cuda-core = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/cuda-core", optional = true }
cutile = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/cutile-rs/cutile", optional = true }

[dev-dependencies]
approx = "0.5"
proptest = "1"
serde_json = "1"

[lints]
workspace = true
