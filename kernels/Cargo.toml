[package]
name = "oxide-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kernel traits and CPU reference implementations for oxide-serve"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
default = ["cpu"]
cpu = []
cuda = ["dep:cuda-device", "dep:cuda-host", "dep:cuda-core"]

[dependencies]
thiserror = "2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gemm = "0.18"
half = "2"
rayon = "1"
cuda-device = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/crates/cuda-device", optional = true }
cuda-host = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/crates/cuda-host", optional = true }
cuda-core = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/crates/cuda-core", optional = true }

[dev-dependencies]
approx = "0.5"
proptest = "1"
serde_json = "1"
