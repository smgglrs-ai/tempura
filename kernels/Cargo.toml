[package]
name = "tempura-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kernel traits and CPU reference implementations for tempura-serve"

[features]
default = ["cpu"]
cpu = []
cuda = ["cutile"]
cutile = ["dep:cutile", "dep:cuda-core"]
npu-intel = []
npu-qualcomm = []
openmp = []

[build-dependencies]
cc = "1"

[dependencies]
tempura-kernel-api = { path = "../kernel-api" }
staticpar = { path = "../crates/staticpar" }
thiserror = "2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gemm = "0.18"
half = "2"
libm = "0.2"
cuda-device = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/cuda-oxide/crates/cuda-device", optional = true }
cuda-host = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/cuda-oxide/crates/cuda-host", optional = true }
cuda-core = { version = "0.3.1", optional = true }
cutile = { version = "0.3.1", optional = true }

[dev-dependencies]
approx = "0.5"
proptest = "1"
serde_json = "1"

[lints]
workspace = true
