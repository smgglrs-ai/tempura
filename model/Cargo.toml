[package]
name = "tempura-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model management for tempura-serve: download, store, list, inspect"

[dependencies]
tempura-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs = "6"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
