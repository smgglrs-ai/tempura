[package]
name = "tempura-kernel-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Verification toolkit for tempura kernel implementations — DualPipeline comparison, test generators, report types"

[dependencies]
tempura-kernel-api = { path = "../kernel-api" }
tempura-kernels = { path = "../kernels" }
tempura-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
