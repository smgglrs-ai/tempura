- id: p8-batch-invariant-verification
  title: Batch-invariant inference verification
  description: Build a test harness that proves inference output for a given sequence is bit-identical
    regardless of what other sequences share the same batch. Today, the forward pass in TransformerModel
    processes sequences with batch=1 and per-sequence KvCache/InferenceSession state, but the BatchScheduler
    groups requests together and future batched execution (batch>1 attention, shared GPU memory) could
    introduce cross-sequence interference. This item creates a BatchInvariantVerifier in the engine that
    runs the same prompt solo and inside varied batch compositions, then asserts bit-identical logits
    and sampled tokens. It also extends the VerificationManifest to record batch-invariance as a proven
    property, and adds a Kani harness proving that attention indexing for one sequence within a batch
    cannot read from another sequence's memory region.
  status: planned
  priority: medium
  effort: M
  scope:
  - engine/src/dual_pipeline.rs
  - kernels/src/verification_manifest.rs
  acceptance:
  - BatchInvariantVerifier in engine/src/batch_invariant.rs runs a prompt through forward() solo and alongside
    1-3 other sequences with different token_ids and cache states, asserting logits_max_abs_diff == 0.0
    and token_match == true for the target sequence in every composition
  - Kani harness in kernels/src/attention.rs proves that for any valid (batch, seq_idx) pair, the q/k/v
    offset range for sequence seq_idx does not overlap with any other sequence's offset range within the
    same batch buffer
  - VerificationManifest in kernels/src/verification_manifest.rs includes a KernelProof entry for batch-invariance
    with status proven once the Kani harness passes
  - 'At least 3 integration tests in engine/src/batch_invariant.rs cover: (a) solo vs batch-of-2, (b)
    solo vs batch-of-4 with heterogeneous prompt lengths, (c) solo vs batch where other sequences have
    pre-populated KV caches at different positions'
  - All tests pass deterministically with cargo test --package oxide-engine (same seed, same output)
  - DualPipeline compare_pipelines extended or complemented to accept batched inputs so CPU-vs-GPU batch
    invariance can be checked in Phase 3
  verification:
    quick: cargo test --package oxide-engine batch_invariant
