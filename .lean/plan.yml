- id: e2e-memory-management
  title: Hybrid memory management layer (VRAM ↔ system RAM ↔ converged)
  description: 'Unified memory management supporting three modes:
    (1) VRAM-only: all weights + KV cache in GPU memory (current, works for small models).
    (2) Hybrid CPU/GPU: weights partitioned across VRAM and system RAM. Layer-by-layer
    streaming — upload layer N weights to GPU, compute, discard, upload layer N+1.
    NOTE: benchmarks show decode-phase Q4K is transfer-dominated (0.3x GPU vs CPU).
    Resident weights are the critical fix — this item enables GPU decode performance.
    Peak VRAM = 1 layer of weights + KV cache + scratch, not all layers.
    (3) Converged: for unified memory architectures (GX10 128GB LPDDR5X, Grace Hopper
    NVLink-C2C, AMD APU), pin system memory and pass device pointers directly — zero
    copy. Runtime detection via cudaDeviceGetAttribute(cudaDevAttrUnifiedAddressing).
    The memory manager is a trait (MemoryPool) with implementations for each mode.
    Weight tensors are accessed via WeightHandle that abstracts over resident/streaming/
    pinned backing. ModelConfig gains a memory_mode field (auto/vram/hybrid/converged).
    Auto mode selects based on model size vs available VRAM.'
