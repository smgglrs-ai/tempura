  description: The server currently calls `axum::serve(listener, app).await.unwrap()` with no signal handling,
    meaning SIGTERM/SIGINT kills the process immediately, dropping in-flight inference requests and SSE
    streams without cleanup. Implement graceful shutdown that listens for termination signals, stops accepting
