  - Job fails if any harness fails
- id: p3-cuda-toolchain
  title: cuda-oxide toolchain setup
  description: 'Prepare the codebase for cuda-oxide GPU kernels. cuda-oxide is a compiler backend (cargo
    oxide build), not a crate dependency. Add stub Cuda* structs behind the cuda feature flag proving
    the feature-gated module structure compiles. Forward cuda feature from engine to kernels. Actual GPU
    implementations go in p3-cuda-kernels.

    '
  status: done
  progress: 100
  priority: high
  effort: M
  scope:
  - kernels/src/attention.rs
  - kernels/src/matmul.rs
  - kernels/src/rmsnorm.rs
  - kernels/src/rope.rs
  - kernels/src/sampling.rs
  - engine/Cargo.toml
  - engine/src/pipeline.rs
  acceptance:
  - cargo build (default features) still succeeds with no CUDA toolkit installed
  - cargo check --features cuda compiles all stub Cuda* structs
  - 'Stub Cuda* structs exist behind #[cfg(feature = cuda)] with todo!() bodies in each kernel file'
  - engine/src/pipeline.rs has KernelPipeline::cuda() constructor behind feature gate
  - engine/Cargo.toml forwards cuda feature to oxide-kernels
  verification:
    quick: cargo build && cargo test
- id: p3-cuda-infra
  title: GPU memory and kernel launch infrastructure
  description: 'Create kernels/src/gpu/ module with CudaContext management and host-to-device transfer
    helpers that map to KernelError. Each Cuda* struct will own a context handle and copy data in/out
    per call.

    '
  status: done
  progress: 100
  priority: high
  effort: M
  depends_on:
  - p3-cuda-toolchain
  scope:
  - kernels/src/gpu/
  - kernels/src/lib.rs
  acceptance:
  - kernels/src/gpu/mod.rs with CudaContext and DeviceBuffer helpers behind cuda feature
  - cargo oxide build succeeds on the kernels crate
  - Helper functions map cuda-oxide errors to KernelError
  verification:
    quick: cargo oxide build --package oxide-kernels
- id: p3-cuda-rope
  title: CudaRoPE — first GPU kernel (elementwise)
  description: 'Elementwise kernel — no shared memory, no reductions. Validates the full pipeline: kernel
