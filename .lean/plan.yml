    '
  status: done
  progress: 100
  priority: high
  effort: M
  depends_on:
  - p3-cuda-infra
  scope:
  - kernels/src/rmsnorm.rs
  - kernels/src/gpu/
  acceptance:
  - DualPipeline CPU vs GPU within 1e-4
  - In-place semantics preserved
  - cargo oxide build && cargo test --features cuda passes
- id: p3-cuda-matmul
  title: CudaMatMul — tiled shared-memory GEMM
  description: 'Tiled shared-memory GEMM following cuda-oxide tiled_sgemm example. Both forward and forward_b_transposed.
    This is the performance bottleneck — the kernel that makes GPU inference worthwhile.

    '
  status: done
  progress: 100
  priority: high
  effort: L
  depends_on:
  - p3-cuda-infra
  scope:
  - kernels/src/matmul.rs
  - kernels/src/gpu/
  acceptance:
  - DualPipeline CPU vs GPU within 1e-4 for m,n,k up to 4096
  - Both forward and forward_b_transposed implemented
  - 'GPU faster than CPU gemm for m,n,k >= 128 (not met: transfer-dominated; GPU wins when data stays
    on-device)'
  - cargo oxide build && cargo test --features cuda passes
- id: p3-cuda-attention
  title: CudaAttention — GQA with softmax reductions
  description: 'Parallelize across (batch, head, position). Warp reductions for softmax. Start with naive
    GPU attention — Flash Attention as follow-up optimization.

    '
  status: done
  progress: 100
  priority: high
  effort: L
