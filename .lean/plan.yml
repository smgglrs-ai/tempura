    per-token counts for penalty application
  - 'CpuSampler applies presence and frequency penalties as additive logit biases before temperature scaling,
    matching the OpenAI formula: logit -= frequency_penalty * count + presence_penalty * (count > 0 ?
    1 : 0)'
  - ChatCompletionRequest and CompletionRequest accept optional presence_penalty and frequency_penalty
    fields, defaulting to 0.0, and pass them into SamplingParams
  - Tests verify that presence_penalty suppresses repeated tokens and frequency_penalty increasingly suppresses
