  - Preemption evicts lowest-priority sequence, preserves token_ids for recompute
  - API handlers submit through BatchScheduler instead of creating InferenceSession inline
  - 'Kani proofs: slot accounting (no double-alloc, no OOB), no-starvation'
  - 'Tests: mixed prefill/decode batches, preemption under full pool, re-admission'
  verification:
    quick: cargo test --workspace
