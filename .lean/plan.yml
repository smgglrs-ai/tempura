    '
  status: done
  progress: 100
  priority: medium
  effort: M
  depends_on:
  - 2b-generate
  - 2c-trace-api
  scope:
  - server/src/api.rs
  - server/src/replay.rs
  acceptance:
  - POST /oxide/v1/replay accepts trace_id or explicit (tokens, seed, params)
  - 'Returns match: true/false with per-token comparison'
  - 'Replay with same seed produces match: true'
- id: 2c-dual-pipeline
  title: DualPipeline comparison endpoint
  description: 'Run two kernel pipeline configs on same input, report divergence. Initially CPU vs CPU
    configs; later CPU vs CUDA for GPU validation.

    '
  status: done
  progress: 100
  priority: medium
  effort: M
  depends_on:
  - 2b-pipeline
  - 2b-forward-pass
  scope:
  - engine/src/dual_pipeline.rs
  - server/src/api.rs
  acceptance:
  - POST /oxide/v1/compare reports per-layer max abs diff, L2 distance, token match
  - Two identical pipelines produce zero divergence
- id: 2c-kani-ci
  title: Kani in CI
  description: 'cargo kani runs on every PR. Verification is continuous, not one-time.

    '
  status: done
  progress: 100
  priority: medium
  effort: S
  depends_on:
  - 2a-kani-kernels
  - 2a-kani-kvcache
  scope:
