- id: p15-quantized-kani-proofs
  title: Kani proofs for quantization math properties
  description: 'Formal verification of quantization arithmetic — properties nobody
    proves today. (1) Bounded error: |dequant(quant(x)) - x| <= step_size/2 for
    symmetric quantization. (2) Monotonicity: x > y implies quant(x) >= quant(y)
    within the same group. (3) Range safety: int32 accumulator in quantized matmul
    does not overflow for any valid input within quantization range. (4) Group
    boundary safety: group quantization index arithmetic never reads across group
    boundaries. (5) Scale invariance: group dequantization produces values within
    the declared range [min, max]. These proofs apply to CpuDequantize and CpuMatMulQ.
    Published as part of the verification manifest.'
  status: done
