  - server/src/api.rs
  description: Add presence_penalty and frequency_penalty fields to SamplingParams and apply them as logit
    biases before temperature scaling in the Sampler trait. Per the OpenAI spec, presence_penalty subtracts
    a flat value from logits of any token that has appeared at least once in the generated output, while
    frequency_penalty subtracts a value proportional to how many times each token has appeared. The generation
    loop in TransformerModel must track token counts across steps and pass them to the sampler. The API
    request structs must accept these parameters and wire them through.
  acceptance:
  - SamplingParams has presence_penalty (f32, default 0.0, range -2.0 to 2.0) and frequency_penalty (f32,
    default 0.0, range -2.0 to 2.0) fields
