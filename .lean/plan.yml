    integers to f32 at matmul time, format-specific loaders parsing quantization metadata, and a quantized
    matmul path in CPU/GPU pipelines.

    '
  status: done
  progress: 100
  priority: low
  effort: XL
  scope:
  - kernels/src/matmul.rs
  - engine/src/loader.rs
  - engine/src/weights.rs
  - engine/src/config.rs
  - engine/src/model.rs
  - engine/src/pipeline.rs
  - server/src/main.rs
  - kernels/src/gpu/
  acceptance:
  - WeightLoader supports non-f32 dtypes (int4, int8, float16) with dtype metadata
  - QuantConfig type (format, bits, group_size, symmetric/asymmetric)
  - GPTQ loader reads qweight/qzeros/scales from safetensors
  - AWQ loader reads AWQ-specific tensor layout
  - GGUF loader parses binary container, loads Q4_0/Q4_1/Q8_0 blocks
