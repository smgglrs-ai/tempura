  - Shutdown logs the number of drained vs forcibly dropped requests at INFO level
  - If all in-flight work completes before the timeout, the process exits immediately rather than waiting
    the full duration
  - Exit code is 0 for clean shutdown, non-zero if requests were forcibly dropped
