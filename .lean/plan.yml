  - Graph automatically invalidated when batch shape changes
  verification:
    quick: cargo test --workspace

- id: p21-flash-decoding
  title: FlashDecoding — optimized decode-phase attention
  description: 'During decode, Q has 1 token but KV cache has thousands. Standard
    attention underutilizes the GPU because the parallelism is only over heads.
    FlashDecoding splits the KV cache across thread blocks, each computing
    partial attention, then reduces. This parallelizes over both heads and KV
    length. Critical for long-context inference.'
  status: pending
  priority: high
  effort: L
  depends_on:
