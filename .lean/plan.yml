  - No correctness regression
  verification:
    quick: cd tests-gpu && CUDA_OXIDE_BACKEND=... cargo oxide run --bin bench-q4k-e2e

- id: gpu-codegen-bfe-cvt-fusion
  title: "cuda-oxide: fused bfe.u32 + cvt.rn.f32.u32 for nibble→float"
  description: 'Pattern-match (x & 0x0F) as f32 and (x >> 4) as f32 in the LLVM
    export layer. Emit bfe.u32 + cvt.rn.f32.u32 as a scheduled pair that the PTX
    JIT can pipeline. Currently LLVM emits and.b32 + cvt separately with possible
    register spill between. Saves ~4 instructions per block. This is the hardest
    codegen improvement — may require an NVVM-level peephole pass.'
  status: pending
  priority: medium
  effort: L
  depends_on:
