  description: Add OpenTelemetry distributed tracing to the server so that each inference request emits
    OTel spans exportable to any OTLP-compatible collector (Jaeger, Grafana Tempo, etc.). The server already
    uses the tracing crate for structured logging and has an internal InferenceTrace system; this item
    bridges both to OTel by adding tracing-opentelemetry as a subscriber layer and converting per-request
    InferenceTrace data (layer timings, sampling steps, token counts) into span attributes. A new --otlp-endpoint
    CLI flag controls the OTLP gRPC exporter destination, defaulting to disabled so existing behavior
