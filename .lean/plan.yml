  # ============================================================================
  # Performance Reference (measured 2026-06-23, RTX 5090, Qwen3-8B Q4_K_M)
  # ============================================================================
  #
  # llama.cpp (llama-bench, build 468bdec):
  #   Decode tg128: 209 tok/s (4.78ms/token)
  #   Prefill pp128: 7335 tok/s
  #
  # tempura (matmul-only, resident weights, best kernel):
  #   Multi-warp coop (8 warps): 179 tok/s (5.58ms)
  #   Cached dispatch:           171 tok/s (5.85ms)
  #   Gap: 0.86x (matmul-only vs llama.cpp full forward)
  #
  # Kernel evolution (this session):
  #   CPU quantized:    1.14 tok/s
  #   Naive GPU:        34 tok/s  (transfer-dominated)
  #   Resident weights: 64 tok/s  (eliminate host↔device copies)
  #   Intra-block coop: 144 tok/s (coalesced weight reads)
  #   Deferred reduce:  157 tok/s (1 shuffle/column instead of per-block)
  #   Multi-warp (8):   179 tok/s (8x more in-flight memory requests)
  #
  # Experiments that didn't help:
  #   Shared-memory activation tile (L1 already handles it)
  #   Fused gate+up GPU kernel (register pressure kills occupancy)
  #   dp4a integer dot product (Q8 header reads > cvt savings)
  #   Packed nibble extraction (LLVM generates same code)
  #   Separated scale/min accumulation (same LLVM codegen)
  #   Multi-row CTA (enough parallelism already on 170 SMs)
  #   Fused QKV weights (larger N doesn't improve bandwidth)
  #   invariant.load metadata (no effect on sm_120 Blackwell)
  #
  # All GPU kernels validated via DualPipeline against Kani-proven CPU reference.
  # ============================================================================
