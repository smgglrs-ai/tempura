- id: p11-disaggregated-serving
  title: Disaggregated prefill/decode serving
  status: done
  progress: 100
  priority: medium
  effort: XL
  depends_on:
  - p7-wire-batch-scheduler
  - p7-chunked-prefill
  scope:
  - engine/src/model.rs
  - engine/src/session.rs
  - engine/src/kv_cache.rs
  - server/src/batch.rs
  - server/src/main.rs
  description: 'Separate prefill (compute-bound) and decode (memory-bound) phases onto different GPU pools
    to eliminate phase interference. In aggregated serving, a long prefill blocks decode iterations for
    all active sequences, spiking inter-token latency. Disaggregated serving runs prefill on dedicated
    GPUs, then transfers KV-cache state to decode GPUs. This requires a KV transfer protocol between
    prefill and decode workers, a coordinator that routes requests to the appropriate phase worker, and
    modifications to InferenceSession to serialize/deserialize KV-cache state across process boundaries.
    Benchmarks from NVIDIA show 1.4-6x throughput improvements depending on workload. This is a Phase 3
    cuda-oxide concern since KV transfer overhead dominates on CPU.'
  acceptance:
  - Engine supports serializing InferenceSession KV-cache state to bytes and deserializing on another instance
  - A PrefillWorker and DecodeWorker abstraction allows running prefill and decode on separate model instances
  - KV transfer protocol moves cache state between workers (initially via shared memory, later via RDMA)
  - Coordinator routes new requests to prefill workers and transfers to decode workers after prefill completes
  - 'End-to-end test: prefill on worker A, transfer KV, decode on worker B produces identical output to
    single-worker inference'
  - Existing single-worker mode continues to work unchanged
  verification:
    quick: cargo test --workspace

