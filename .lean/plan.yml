- id: p7-wire-batch-scheduler
  title: Wire BatchScheduler into API handlers
  status: done
  progress: 100
  description: The BatchScheduler in server/src/batch.rs has full slot allocation, preemption, and lifecycle
    management, but the API handlers in server/src/api.rs bypass it entirely — they create InferenceSession
    directly and call model.generate() inline. AppState already holds an Arc<Mutex<BatchScheduler>> that
    no handler touches. This item wires chat_completions and completions handlers to submit InferenceRequest
    to the scheduler, acquire a slot via admit_new_requests(), run inference within that slot, and call
    complete_sequence() on finish. The streaming path must also go through the scheduler so slot accounting
    is correct under concurrent SSE connections. Metrics for pending/active/preempted counts should be
    emitted so the scheduler state is observable.
  priority: critical
  effort: M
  depends_on:
  - p4-batch-scheduler
  scope:
  - server/src/api.rs
  - server/src/main.rs
  acceptance:
  - API handlers (chat_completions, completions) submit an InferenceRequest to the BatchScheduler and
    acquire a slot before running inference
  - Slots are released via complete_sequence() on every code path including errors and early stream disconnects
  - When all slots are occupied, new requests either queue in pending or trigger preemption — never bypass
    the scheduler
  - Streaming (SSE) requests hold a scheduler slot for the duration of token generation and release it
    when the stream ends or the client disconnects
  - Scheduler queue depths (active_count, pending_count, preempted_count) are emitted as Prometheus gauges
    on each request
  - Existing tests (cargo test -p oxide-server) continue to pass and at least one new integration test
    verifies that concurrent requests are gated by max_batch_size
  verification:
    quick: cargo test -p oxide-server
- id: p7-prefix-caching
  title: Prefix caching (hash-based KV reuse)
  description: Introduce block-based KV cache management with content-addressable hash lookup so that
    requests sharing a common prefix (e.g., system prompt) reuse already-computed KV blocks instead of
    recomputing them. This requires restructuring `KvCache` from flat per-layer vectors into fixed-size
    blocks (e.g., 16 tokens), adding a global `PrefixCacheTable` that maps block hashes (computed from
    token ID sequences) to immutable KV data, and modifying session creation and the batch scheduler to
    probe the cache table before running prefill. The current architecture creates a fresh `InferenceSession`
    per request with no KV reuse, so this is a significant structural change to the engine's memory management
    layer.
  status: planned
  priority: high
  effort: L
  depends_on:
  - p7-wire-batch-scheduler
  scope:
  - engine/src/kv_cache.rs
  - server/src/batch.rs
  acceptance:
  - KvCache is refactored into fixed-size blocks (e.g., 16 tokens per block) with a BlockTable indirection
    layer, while preserving existing append/slice/reset semantics and passing all current tests
  - A PrefixCacheTable (engine-level, thread-safe) maps hash(token_id_sequence) to immutable KV block
    data, with reference counting and an eviction policy (LRU or similar) that reclaims blocks when no
    active sequence references them
  - 'InferenceSession creation probes the prefix cache: given a token_id sequence, it identifies the longest
    cached prefix, copies block references (not data), and returns the position at which new computation
    must begin'
  - BatchScheduler.admit_new_requests populates the prefix_matched_len on ActiveSequence so the forward
    pass skips already-cached layers, and metrics track prefix cache hit rate and tokens saved
  - 'Tests verify correctness: two requests with identical prefixes produce bit-identical KV data via
    cache reuse, a request with a novel prefix falls back to full prefill, and eviction under memory pressure
    does not corrupt active sequences'
  - 'Compressed KV (TurboQuant) continues to work: blocks can be stored in compressed form and the hash
    lookup is agnostic to compression state'
  verification:
    quick: cargo test --workspace
- id: p7-chunked-prefill
  title: Chunked prefill
  description: Split long prompt prefills into fixed-size chunks so that each chunk can be processed through
    the transformer layers independently, with KV cache accumulating across chunks. This prevents a single
    long prompt from monopolizing compute for an entire forward pass, allowing decode steps from other
    active sequences to be interleaved between prefill chunks in the batch scheduler. The engine's forward
    method currently processes the entire token_ids slice in one call (model.rs line 38), and the scheduler
    tracks Prefill vs Decode state but does not subdivide prefills (batch.rs SequenceState). A chunked_prefill
    method on TransformerModel and a chunk-aware scheduling loop in BatchScheduler are the core additions.
  status: planned
  priority: high
  effort: M
  depends_on:
  - p7-wire-batch-scheduler
  scope:
  - engine/src/model.rs
  - server/src/batch.rs
  acceptance:
  - Configurable chunk size (e.g. prefill_chunk_size on ModelConfig or BatchScheduler) with a sensible
    default (e.g. 512 tokens)
  - TransformerModel exposes a chunked prefill path that processes N tokens at a time, advancing session.position
    and KV cache correctly across chunks, producing identical final logits to a single unchunked forward
    call on the same input
  - BatchScheduler tracks partial-prefill progress per ActiveSequence (prefill_offset field) and transitions
    to Decode state only after all chunks are processed
  - 'Scheduler interleaving: between prefill chunks of one sequence, decode steps from other active sequences
    can be scheduled in the same batch iteration'
  - 'Determinism preserved: chunked prefill with any chunk size produces bit-identical output to unchunked
    prefill for the same seed'
  - Unit test proving chunked prefill output matches unchunked output for prompts longer than chunk_size
  verification:
    quick: cargo test --package oxide-engine --package oxide-server
- id: p8-timing-info
  title: Populate timing info in InferenceTrace
  description: 'The `generate` and `generate_with_callback` methods in `engine/src/model.rs` set `prompt_tokens`
    and `generated_tokens` on the trace but never populate the `timing: Option<TimingInfo>` field. This
    item adds `std::time::Instant` measurements around the prompt-processing forward pass (prompt phase)
    and the autoregressive generation loop (generation phase), then computes `total_ms`, `prompt_ms`,
    `generation_ms`, and `tokens_per_second` to fill `TimingInfo` before the methods return. The `forward`
    method should also record per-layer `duration` in each `LayerSnapshot` when tracing is at Summary
    level or above (the field exists but is always set to `None`).'
  status: done
  progress: 100
  priority: high
  effort: S
  scope:
  - engine/src/model.rs
  - engine/src/trace.rs
  acceptance:
  - generate() and generate_with_callback() populate session.trace.timing with a TimingInfo containing
    non-zero total_ms, prompt_ms, generation_ms, and tokens_per_second after completion
  - prompt_ms measures only the initial forward pass over the full prompt token sequence; generation_ms
    measures the autoregressive token-by-token loop
  - tokens_per_second is calculated as generated_tokens / (generation_ms / 1000.0), or 0.0 when generation_ms
    is zero
  - Per-layer LayerSnapshot.duration is populated with the wall-clock time of each transformer layer when
    trace_level >= Summary
  - Timing is collected regardless of trace_level (TimingInfo is always set); only per-layer duration
    respects the Summary threshold
  - Existing tests continue to pass and at least one new test asserts that timing fields are populated
    and internally consistent (total_ms >= prompt_ms + generation_ms)
  verification:
    quick: cd /home/fdupont/Code/github.com/smgglrs-ai/oxide-serve && cargo test --package oxide-engine
