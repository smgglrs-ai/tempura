  # ============================================================================
  # Phase 20: Memory — PagedAttention + FP8 KV Cache
  # Table-stakes memory management for production throughput.
  # ============================================================================

- id: p20-paged-attention
  title: PagedAttention — virtual memory for KV cache
  description: 'Replace contiguous KV cache allocation with paged allocation.
    Divide GPU memory into fixed-size pages (e.g., 16 tokens). Each request
    maps logical KV positions to physical pages via a block table. Pages
    allocated on demand, freed immediately on completion. The Attention trait
    gains a block_table parameter. The attention kernel reads K/V through
    the block table. KvCachePool becomes a page allocator. BatchScheduler
    tracks pages per request, preempts by releasing pages. Prefix sharing
    becomes copy-on-write at the page level.'
  status: done
  progress: 100
  priority: critical
  effort: XL
  depends_on:
  - p12-crate-split
  scope:
  - kernel-api/src/lib.rs
  - kernels/src/attention.rs
  - kernels/src/gpu/mod.rs
  - engine/src/kv_cache.rs
  - engine/src/session.rs
  - server/src/batch.rs
  acceptance:
  - Attention trait accepts block_table parameter for paged KV access
  - KvCachePool allocates/frees fixed-size pages, not contiguous slots
  - Block table maps logical position to physical page + offset
  - Prefix sharing via copy-on-write pages
  - 'Memory utilization: <5% waste vs ~90% waste with contiguous allocation'
  - Kani proof for block table index arithmetic (logical → physical offset in bounds)
  - DualPipeline confirms paged attention matches contiguous attention numerically
  - Existing tests pass unchanged
  notes:
  - '2026-06-23: forward_paged added to Attention trait with default gather-then-forward
    impl. PageAllocator, BlockTable, PagedKvCache data structures implemented with
    append/advance/reset/contiguous access. 2 Kani proofs for block table arithmetic.
    9 new tests including paged-vs-contiguous equivalence. Remaining: CoW prefix sharing,
    session/model wiring, BatchScheduler page tracking.'
  verification:
    quick: cargo test --workspace

- id: p20-fp8-kv-cache
  title: FP8 KV cache — halve cache memory
  description: 'Store KV cache values in FP8 (E4M3 or E5M2) instead of FP16,
    halving per-token cache memory. Quantize K/V on write, dequantize on read
    during attention. The quantization is per-page (one scale per page of 16
    tokens). Kani proves the quantization index arithmetic. DualPipeline
    verifies FP8 vs FP16 output divergence is within acceptable epsilon.'
  status: done
  progress: 100
  priority: high
  effort: L
  depends_on:
  - p20-paged-attention
  scope:
  - engine/src/kv_cache.rs
  - kernels/src/attention.rs
  acceptance:
  - KV cache supports FP8 storage mode (configurable, FP16 remains default)
  - Per-page scale factors for FP8 quantization
  - DualPipeline FP8 vs FP16 divergence within 1e-3 per layer
  - Memory reduction confirmed (2x more sequences at same GPU memory)
  verification:
    quick: cargo test --workspace

