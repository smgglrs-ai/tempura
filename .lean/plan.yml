- id: p21-cuda-graphs
  title: CUDA Graphs — capture and replay the forward pass
  description: 'Capture the decode-phase forward pass (fixed-shape operations)
    as a CUDA graph and replay it without per-kernel launch overhead. The
    first decode step runs normally and records the kernel sequence. Subsequent
    steps replay the graph, updating only the input pointers. This eliminates
    ~1ms of CPU-side kernel launch overhead per step. DualPipeline verifies
    graph replay matches non-graph execution.'
  status: pending
