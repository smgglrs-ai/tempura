- id: p3-turboquant
  title: TurboQuant/PQO KV-cache compression kernel
  description: 'Add a KV-cache compression kernel using PolarQuant-Only (PQO) from TurboQuant (ICLR 2026).
    Introduces a KvCacheCompressor trait with compress/decompress operations that quantize KV vectors
    to 3 bits using polar coordinate encoding, a CPU reference, and a cuda-oxide GPU kernel behind the
    cuda feature flag. The engine KvCache gains an optional compression layer extending sequence capacity
    ~5x. Adapts the PQO variant (no QJL bias correction) into the existing kernel trait pattern with Kani
    verification harnesses.

    '
  status: done
  progress: 100
  priority: medium
  effort: L
  depends_on:
  - p3-cuda-matmul
  scope:
  - kernels/src/turboquant.rs
  - kernels/src/lib.rs
  - kernels/src/gpu/turboquant_kernel.rs
  - kernels/src/gpu/mod.rs
  - kernels/src/verification_manifest.rs
  - kernels/Cargo.toml
  - engine/src/kv_cache.rs
  - engine/src/pipeline.rs
  - engine/src/dual_pipeline.rs
  acceptance:
  - KvCacheCompressor trait with compress(&[f32], head_dim) -> CompressedKV and decompress methods
  - 'CpuPolarQuant: round-trip error below 5% relative L2 norm (property-tested)'
  - CudaPolarQuant behind cuda feature flag, matching CPU output within GPU tolerance
  - KvCache optional CompressedKvCache mode (compress on append, decompress on read)
  - Kani harnesses prove compress/decompress bounds-safety (no OOB, no panics)
  - 'DualPipeline comparison: compressed vs uncompressed KvCache divergence report'
  notes:
  - 'tech-watch-2026-06-19: TurboQuant confirmed near-lossless at 3.5 bits (absolute
    quality neutrality) by MarkTechPost comparison article. OSCAR (Together AI) leads
    at INT2 (2.28 bits, 0.02-point gap from BF16 on Qwen3-32B) with full SGLang
    integration — a potential second KvCacheCompressor implementation for users who
    can afford calibration. EpiCache (Apple) complements quantization with episodic
    clustering eviction for multi-turn (4-6x compression). Article concludes these
    methods are "more complementary than competitive" — validates the trait-based
    composable design. OSCAR paper claims TurboQuant drops 40+ points at INT2, but
    this is below TurboQuant intended range (3-4 bit sweet spot). No competing system
    does formal verification of KV compression.'
  verification:
    quick: cargo test --package tempura-kernels --package tempura-engine
- id: p4-kvcache-pool
  title: Multi-sequence KV cache (slot-based pool)
  description: 'Refactor KvCache from single-sequence to slot-based pool managing multiple concurrent
    sequences. Pre-allocate fixed slots with acquire/release semantics. InferenceSession references a
    slot instead of owning a cache. Prerequisite for continuous batching — without it, all requests serialize
    through a single cache.

    '
  status: done
  progress: 100
  priority: medium
  effort: M
  scope:
  - engine/src/kv_cache.rs
  - engine/src/session.rs
  - engine/src/model.rs
  - server/src/batch.rs
  - server/src/api.rs
  acceptance:
  - KvCachePool with configurable num_slots, independent K/V buffers per slot
  - acquire() returns SlotHandle or error; release(slot) resets and returns to pool
  - InferenceSession holds slot index, model.forward() routes through pool
  - BatchScheduler.next_batch() acquires slots, releases on completion, backpressure when exhausted
  - Pool of size 1 behaves identically to current KvCache (backward compat)
  - 'Concurrent slot isolation tested: two slots produce independent K/V slices'
  verification:
    quick: cargo test --workspace
- id: p4-batch-scheduler
  title: Verified continuous batching with preemption
  description: 'Replace stub FIFO BatchScheduler with iteration-level continuous batching. Tracks active
    sequences, manages slot-based KV cache pool, supports preemption under memory pressure. Admits new
    prefill requests between decode iterations. Kani harnesses prove no-starvation and slot-accounting
    safety.

    '
  status: done
  progress: 100
  priority: medium
  effort: XL
  depends_on:
  - p4-kvcache-pool
  scope:
  - engine/src/kv_cache.rs
  - server/src/batch.rs
  - server/src/api.rs
  - server/src/main.rs
  - engine/src/session.rs
  acceptance:
