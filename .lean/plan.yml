- id: p21-fused-kernels
  title: Fused kernels — RMSNorm+residual, SiLU×gate
  description: 'Combine commonly sequential operations into single kernel
    launches to reduce HBM traffic and kernel launch overhead. Priority
    fusions: (1) RMSNorm + residual add — read hidden state once, normalize
    and add residual in one pass. (2) SiLU activation × gate multiply —
    the gated FFN pattern. (3) Bias + residual add. Each fused kernel has
    a Kani proof and DualPipeline comparison against the sequential version.'
