- id: p6-guided-decoding
  title: Structured output / JSON mode (guided decoding)
  status: done
  progress: 100
  priority: high
  effort: L
  description: 'Add constrained decoding so the server can guarantee structurally valid output (JSON mode
    and JSON Schema mode). This requires a grammar-based logit masking layer that sits between the forward
    pass and the sampler: at each token step, a constraint engine (finite-state or pushdown automaton
    built from a JSON Schema or a bare JSON grammar) computes an allowed-token bitmask over the vocabulary,
    sets disallowed logits to negative infinity before sampling, and advances its own state after the
    selected token is decoded. The API must accept the OpenAI-compatible `response_format` field (`{"type":"json_object"}`
    and `{"type":"json_schema","json_schema":{...}}`) on both `/v1/chat/completions` and `/v1/completions`,
    and the engine''s generate loop must thread the constraint through every token step while preserving
    deterministic replay and trace observability.'
  acceptance:
  - API accepts `response_format` with type `json_object` and `json_schema` on `/v1/chat/completions`
    and `/v1/completions`; requests without the field behave identically to today (no regression)
  - 'A `GuidedDecoder` trait in `kernels/` defines the logit-masking contract (`fn mask_logits(&mut self,
    token_ids_so_far: &[u32], logits: &mut [f32])` and `fn is_complete(&self) -> bool`), with a CPU implementation
    backed by a JSON/JSON-Schema grammar'
  - The `generate` and `generate_with_callback` loops in `engine/src/model.rs` call the guided decoder
    (when present) to mask logits before every `sampler.apply` call, and stop generation when the constraint
    signals completion
  - 'Output produced under `json_object` mode is always valid JSON; output under `json_schema` mode validates
    against the provided schema (tested with at least three non-trivial schemas: flat object, nested object,
    array of objects)'
  - Guided decoding state is captured in `InferenceTrace` sampling snapshots (number of tokens masked
    per step) so traces remain useful for debugging constrained generation
  - '`cargo test` passes with new unit tests covering: grammar state machine transitions, logit masking
    correctness, round-trip API request with `response_format`, and deterministic replay of a guided-decoding
    run producing identical output'
  scope:
