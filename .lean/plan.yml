    FusedTransformerLayer takes full layer inputs (hidden_state, positions, kv_cache)
    and produces full layer outputs. CompiledPrefill takes a token sequence and
    produces KV cache entries. DualPipeline verifies graph-level output against the
    composition of individual operations. Per-operation trace granularity is lost
    inside fused blocks, but per-block I/O verification is preserved.'
