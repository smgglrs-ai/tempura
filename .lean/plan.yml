- id: gpu-codegen-vectorized-load
  title: "cuda-oxide: vectorized byte loads (ld.b32 for 4 consecutive i8)"
  description: 'In the MIR importer, detect 4 consecutive i8 loads from the same
    base pointer with stride-1 offsets. Fuse them into a single i32 load + byte
    extract. Currently each qs[offset+i] becomes a separate ld.global.u8; the
    fused version emits one ld.global.b32 and 4 byte-extract shifts. Saves ~3
    instructions per Q4K block per lane.'
  status: pending
  priority: high
  effort: M
  scope:
  - ~/Code/github.com/NVLabs/cuda-oxide/crates/mir-importer/src/translator/rvalue.rs
  acceptance:
  - Generated NVVM IR uses i32 loads where 4 consecutive i8 loads existed
  - No correctness regression (DualPipeline CPU vs GPU match unchanged)
  - Measurable reduction in instruction count per Q4K block
  verification:
    quick: cd tests-gpu && CUDA_OXIDE_BACKEND=... cargo oxide run --bin bench-q4k-e2e

- id: gpu-codegen-packed-scales
  title: "cuda-oxide: packed scale unpacking via u16 bitwise ops"
  description: 'The Q4K scale unpacking reads 12 bytes and performs ~40 bitwise
    ops to extract 8 6-bit scales and 8 6-bit mins. Currently each byte is loaded
    individually. Optimize by loading as 3 u32 or 6 u16 and using packed bitwise
    ops. Saves ~8 instructions per block.'
  status: pending
  priority: high
  effort: M
  depends_on:
  - gpu-codegen-vectorized-load
  scope:
  - ~/Code/github.com/NVLabs/cuda-oxide/crates/mir-importer/src/translator/rvalue.rs
  acceptance:
