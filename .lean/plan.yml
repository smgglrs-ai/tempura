  - DualPipeline CPU vs GPU within 1e-4 for various configs
  - Position-zero identity property preserved on GPU
  - cargo oxide build && cargo test --features cuda passes
- id: p3-cuda-rmsnorm
  title: CudaRMSNorm — warp-level reductions
  description: 'Introduces warp-level shuffle reductions for sum-of-squares. One thread block per token
