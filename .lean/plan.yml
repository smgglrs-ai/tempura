  acceptance:
  - Decode attention splits KV across thread blocks with partial softmax
  - Correct reduction of partial attention outputs
  - 2-8x speedup on decode for sequences > 1024 tokens
  - Kani proof for split/reduce index arithmetic
  - DualPipeline confirms FlashDecoding matches standard attention
  verification:
