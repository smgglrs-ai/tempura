    safe. Implement a CompositionVerifier that takes a sequence of kernel invocations
    (the layer computation graph), checks dimensional compatibility at each boundary,
    and generates a Kani harness proving the composition. DualPipeline then verifies
    numerical equivalence of the composed graph vs individual operations. This is
    the theoretical foundation for NPU graph-level traits: prove the unfused version,
    verify the fused version matches.'
