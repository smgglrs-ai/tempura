summary: |
  11 inference-related sources analyzed. 1 plan item (DFlash implementation).
  Key correction: DSpark is GPU-based (not ASIC), 1.6-1.85x (not 60-85%).
  DFlash honest range is 3-6x (not 15x). llm-d is orchestration above
  model servers, not a competitor. DFlash+KV quantization gap is a unique
  differentiation opportunity for tempura's formally-verified approach.
