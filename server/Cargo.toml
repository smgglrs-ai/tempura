[package]
name = "tempura-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenAI-compatible HTTP server for tempura-serve"

[dependencies]
tempura-engine = { path = "../engine" }
tempura-kernels = { path = "../kernels" }
tempura-model = { path = "../model" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["tonic"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }

[features]
default = []
cuda = ["tempura-engine/cutile", "cutile"]
cutile = ["tempura-engine/cutile"]
otlp = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing-opentelemetry"]

[dev-dependencies]
tower = "0.5"

[lints]
workspace = true
