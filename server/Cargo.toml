[package]
name = "tempura-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenAI-compatible HTTP server library for tempura"

[dependencies]
tempura-engine = { path = "../engine" }
tempura-kernels = { path = "../kernels" }
tempura-model = { path = "../model" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
core_affinity = "0.8"
tokio-stream = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["tonic"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
cutile = { path = "../../../NVLabs/cuda-oxide/cutile-rs/cutile", optional = true }
cuda-core = { path = "../../../NVLabs/cuda-oxide/cuda-core", optional = true }

[features]
default = []
# WHY oxide-gemv is forced into both GPU features (2026-11-15): the serving
# binary built with only `cutile` had NO oxide Q4K GEMV kernels -- every
# Q4K projection ran the slow cuTile fallback (0.5 s/step at m=6, 92% of
# GPU time) while bench-gpu (feature-unified with oxide-gemv) ran the
# oxide kernels.  The kernels' build.rs falls back to the crate-root PTX
# or an empty file, so this stays buildable on hosts without cargo oxide.
cuda = ["tempura-engine/cutile", "tempura-engine/oxide-gemv", "cutile"]
cutile = ["tempura-engine/cutile", "tempura-engine/oxide-gemv", "dep:cutile"]
otlp = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing-opentelemetry"]
openmp = ["tempura-engine/openmp"]

[dev-dependencies]
tower = "0.5"

[lints]
workspace = true
