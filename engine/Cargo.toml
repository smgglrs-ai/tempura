[package]
name = "oxide-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Inference engine for oxide-serve: model loading, KV-cache, forward pass"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
default = []
cuda = ["oxide-kernels/cuda"]

[dependencies]
oxide-kernels = { path = "../kernels" }
safetensors = "0.5"
tokenizers = "0.21"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
minijinja = "2"
