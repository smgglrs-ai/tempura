[package]
name = "tempura-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Inference engine for tempura-serve: model loading, KV-cache, forward pass"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
default = []
cuda = ["tempura-kernels/cuda", "dep:cuda-core"]

[dependencies]
tempura-kernel-api = { path = "../kernel-api" }
tempura-kernels = { path = "../kernels" }
safetensors = "0.5"
tokenizers = "0.21"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
rand = "0.9"
rayon = "1"
minijinja = "2"
cuda-core = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/crates/cuda-core", optional = true }

[dev-dependencies]
tempfile = "3"
bytemuck = "1"
