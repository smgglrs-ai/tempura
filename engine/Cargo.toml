[package]
name = "tempura-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Inference engine for tempura-serve: model loading, KV-cache, forward pass"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
default = []
cuda = ["tempura-kernels/cuda"]
cutile = ["tempura-kernels/cutile", "dep:cutile", "dep:cuda-core"]
edge-metrics = []

[dependencies]
tempura-kernel-api = { path = "../kernel-api" }
tempura-kernels = { path = "../kernels" }
safetensors = "0.5"
tokenizers = "0.21"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
memmap2 = "0.9"
sha2 = "0.10"
rand = "0.9"
rayon = "1"
cutile = { version = "0.3.1", optional = true }
cuda-core = { version = "0.3.1", optional = true }
minijinja = { version = "2", features = ["json"] }
vstd = { workspace = true }
hf-chat-template = "0.2.1"

[package.metadata.verus]
verify = true

[[bench]]
name = "inference_bench"
harness = false

[[bench]]
name = "bitnet_bench"
harness = false

[dev-dependencies]
tempfile = "3"
bytemuck = "1"
proptest = "1"
