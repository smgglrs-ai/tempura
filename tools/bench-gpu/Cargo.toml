[package]
name = "tempura-bench-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU kernel benchmarks using cuTile -- plain cargo build, no cargo oxide required"

[[bin]]
name = "bench-kernels"
path = "src/bench_kernels.rs"

[[bin]]
name = "bench-e2e"
path = "src/bench_e2e.rs"

[[bin]]
name = "bench-attn"
path = "src/bench_attn.rs"

[[bin]]
name = "bench-real-model"
path = "src/bench_real_model.rs"

[[bin]]
name = "bench-speculative"
path = "src/bench_speculative.rs"

[[bin]]
name = "bench-batch"
path = "src/bench_batch.rs"

[[bin]]
name = "bench-mxfp4"
path = "src/bench_mxfp4.rs"

[[bin]]
name = "bench-quality"
path = "src/bench_quality.rs"

[[bin]]
name = "bench-decode-ops"
path = "src/bench_decode_ops.rs"

[[bin]]
name = "bench-perplexity"
path = "src/bench_perplexity.rs"

[[bin]]
name = "bench-mmlu"
path = "src/bench_mmlu.rs"

[[bin]]
name = "bench-selfconsistency"
path = "src/bench_selfconsistency.rs"

[features]
# GPU-side bins need the CUDA toolkit at build time; default-on keeps the
# remote workflow (`scripts/gpu-remote.sh bench`) unchanged. CPU-only hosts
# build with --no-default-features --bin bench-selfconsistency.
default = ["cutile"]
cutile = [
  "tempura-kernels/cutile",
  "tempura-kernels/oxide-gemv",
  "tempura-engine/cutile",
  "tempura-engine/oxide-gemv",
  "dep:cutile",
  "dep:cuda-core",
]

[dependencies]
tempura-kernels = { path = "../../kernels" }
tempura-engine = { path = "../../engine" }
cutile = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/cutile-rs/cutile", optional = true }
cuda-core = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/cuda-core", optional = true }
half = "2"
serde_json = "1"

[lints]
workspace = true
