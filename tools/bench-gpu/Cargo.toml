[package]
name = "tempura-bench-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU kernel benchmarks using cuTile -- plain cargo build, no cargo oxide required"

[[bin]]
name = "bench-kernels"
path = "src/bench_kernels.rs"

[[bin]]
name = "bench-e2e"
path = "src/bench_e2e.rs"

[[bin]]
name = "bench-attn"
path = "src/bench_attn.rs"

[[bin]]
name = "bench-real-model"
path = "src/bench_real_model.rs"

[[bin]]
name = "bench-speculative"
path = "src/bench_speculative.rs"

[[bin]]
name = "bench-batch"
path = "src/bench_batch.rs"

[[bin]]
name = "bench-mxfp4"
path = "src/bench_mxfp4.rs"

[[bin]]
name = "bench-quality"
path = "src/bench_quality.rs"

[[bin]]
name = "bench-decode-ops"
path = "src/bench_decode_ops.rs"

[[bin]]
name = "bench-perplexity"
path = "src/bench_perplexity.rs"

[dependencies]
tempura-kernels = { path = "../../kernels", features = ["cutile", "oxide-gemv"] }
tempura-engine = { path = "../../engine", features = ["cutile", "oxide-gemv"] }
cutile = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/cutile-rs/cutile" }
cuda-core = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/cuda-core" }
half = "2"

[lints]
workspace = true
