[package]
name = "tempura-tests-gpu"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "tempura-tests-gpu"
path = "src/main.rs"

[[bin]]
name = "bench-kernels"
path = "src/bench_kernels.rs"

[[bin]]
name = "bench-e2e"
path = "src/bench_e2e.rs"

[[bin]]
name = "bench-q4k-e2e"
path = "src/bench_q4k_e2e.rs"

[[bin]]
name = "bench-attn-matrix"
path = "src/bench_attn_matrix.rs"

[features]
cuda = []

[dependencies]
tempura-kernels = { path = "../kernels", features = ["cpu", "cuda"] }
tempura-engine = { path = "../engine", features = ["cuda"] }
cuda-core = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/crates/cuda-core" }
cuda-device = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/crates/cuda-device" }
cuda-host = { path = "/home/fdupont/Code/github.com/NVLabs/cuda-oxide/crates/cuda-host" }
half = "2"
