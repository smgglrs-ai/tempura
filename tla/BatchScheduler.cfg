\* TLC model checker configuration for BatchScheduler
\* Run: tlc -config BatchScheduler.cfg BatchScheduler.tla

SPECIFICATION Spec

\* Small model: 3 requests, 2 KV slots, batch size 2
\* State space is exhaustively enumerable (< 50K states)
CONSTANTS
    REQ_IDS   = {r1, r2, r3}
    KV_SLOTS_MAX = 2
    MAX_BATCH_SIZE = 2

INVARIANTS
    TypeOK
    Safety
    KvUsageInvariant
    KvBoundInvariant
    NoDoubleSchedule
    CompletedNeverRunning
    BatchSizeBound

PROPERTIES
    AllEventuallyComplete
