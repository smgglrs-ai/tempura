\* TLC model checker configuration for SpeculativeDecoding.
\* Run: java -jar ~/tla/tla2tools.jar tlc -config tla/SpeculativeDecoding.cfg tla/SpeculativeDecoding.tla

SPECIFICATION Spec

\* Small but representative model:
\*   MAX_DRAFT=2  -- 2 draft tokens per round
\*   TOTAL_KV_SLOTS=8  -- 8 total slots (prompt=1, up to 3 accepted + 2 draft + headroom)
\*   MAX_TOKENS=3  -- generate 3 tokens total
\*
\* State space: exhaustively enumerable (< 1000 distinct states).
CONSTANTS
    MAX_DRAFT = 2
    TOTAL_KV_SLOTS = 8
    MAX_TOKENS = 3

INVARIANTS
    TypeOK
    Safety
    SlotConservation
    DraftBounded
    DraftSlotsConsistent
    NoDraftAfterDone
    AcceptedSlotsConsistent

PROPERTIES
    EventuallyDone
    AcceptedCountMonotone
    AcceptedSlotsMonotone
